# Author: Andreas Rupp, Heidelberg University, 2021.

name: Windows

on: [push]

env:
  PKGS: >-
    mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
    mingw-w64-ucrt-x86_64-openblas mingw-w64-ucrt-x86_64-lapack mingw-w64-ucrt-x86_64-hdf5
    mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-cython mingw-w64-ucrt-x86_64-python-numpy
    mingw-w64-ucrt-x86_64-python-scipy mingw-w64-ucrt-x86_64-python-matplotlib
    mingw-w64-ucrt-x86_64-python-pandas mingw-w64-ucrt-x86_64-python-joblib


jobs:
  # ============ Test code on Windows using MinGW-w64 GCC of the MSYS2 UCRT64 environment. ============
  # ============ Compiler, CMake, LAPACK (OpenBLAS), and Python all stem from MSYS2.        ============
  build_and_test_windows:
    name: Test code with MinGW-w64 g++ (MSYS2 UCRT64) on windows-latest
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: ${{ env.PKGS }}
    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++
    - name: Build
      run: cmake --build build --config Debug
    - name: Test
      run: ctest --test-dir build -C Debug --output-on-failure
