# Author: Andreas Rupp, Heidelberg University, 2021.

name: CMake

on: [push]

# A new push to a branch supersedes the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No Cython: the tests use the nanobind path only.
  PYTHON: numpy scipy


jobs:
  # ============== Test code on the latest Ubuntu with the latest available compilers =============
  build_and_test_ubuntu:
    strategy:
      matrix:
        comp: [ {pkg: g++-14, cxx: g++-14}, {pkg: clang-19, cxx: clang++-19} ]

    name: Test code with ${{ matrix.comp.cxx }} on ubuntu-24.04
    runs-on: ubuntu-24.04
    env:
      # Both are also picked up by the CMake runs of the just-in-time compiled Python modules.
      CXX: ${{ matrix.comp.cxx }}
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      # One line per compiler call with its result; summarized by the step "ccache misses".
      CCACHE_LOGFILE: ${{ github.workspace }}/ccache.log
      APT: libopenblas-serial-dev ccache ${{ matrix.comp.pkg }}

      # Only the submodules the build needs (not docker.git).
      SUBMODULES: >-
        submodules/tensor_product_chain_complex.git submodules/tensor_product_polynomials.git
        submodules/nanobind.git

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # The submodule repositories are cached by the commits they are pinned to. A cache of other
    # pins still helps: only the submodules whose pin changed are fetched.
    - name: Submodule pins
      id: pins
      run: echo "hash=$(git ls-tree HEAD $SUBMODULES | sha256sum | cut -c1-16)" >> $GITHUB_OUTPUT
    - name: Restore submodules
      id: submodules
      uses: actions/cache/restore@v4
      with:
        path: .git/modules
        key: submodules-${{ steps.pins.outputs.hash }}
        restore-keys: submodules-
    - name: Fetch submodules
      run: git submodule update --init --recursive --depth 1 --jobs 4 -- $SUBMODULES
    - name: Save submodules
      if: steps.submodules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .git/modules
        key: submodules-${{ steps.pins.outputs.hash }}
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    # The installed packages, not only the downloaded wheels (unpacking and byte-compiling numpy
    # and scipy took most of the step): keyed by the interpreter's location, which contains its
    # exact version, and the package list.
    - name: Restore Python packages
      uses: actions/cache@v4
      with:
        path: ${{ env.pythonLocation }}/lib/python3.13/site-packages
        key: site-packages-${{ env.pythonLocation }}-${{ env.PYTHON }}
    - name: Install Python packages
      run: python3 -m pip install ${{ env.PYTHON }}
    # The .deb files apt would download, keyed by the runner image: on a hit, neither apt-get update
    # nor a download, only dpkg (which runs the packages' scripts, e.g. the alternatives below).
    - name: Runner image
      id: image
      run: echo "version=$ImageOS-$ImageVersion" >> $GITHUB_OUTPUT
    - name: Restore apt packages
      uses: actions/cache@v4
      with:
        path: ~/apt-debs
        key: apt-${{ steps.image.outputs.version }}-${{ env.APT }}
    - name: Install apt packages
      run: |
        if ! ls ~/apt-debs/*.deb > /dev/null 2>&1; then
          # only what this image lacks, into a directory of its own
          mkdir -p ~/apt-debs/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --download-only \
            -o Dir::Cache::archives="$HOME/apt-debs" $APT
          # apt ran as root: its lock and partial/ must not end up in the cache, which the runner
          # user saves
          sudo rm -rf ~/apt-debs/partial ~/apt-debs/lock
          sudo chown -R "$USER" ~/apt-debs
        fi
        sudo dpkg -i ~/apt-debs/*.deb
        # The serial OpenBLAS (no threads, every test run is serial) is the system libblas.so and
        # liblapack.so through Debian's alternatives, instead of the reference implementations.
        readlink -f /usr/lib/x86_64-linux-gnu/libblas.so /usr/lib/x86_64-linux-gnu/liblapack.so
    # One cache per compiler and commit; a new commit starts from the latest cache of its compiler.
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ matrix.comp.cxx }}-${{ github.sha }}
        restore-keys: ccache-${{ matrix.comp.cxx }}-
    # tests/ and examples/ only: tests_c++ and tests_python are being migrated (tests/RECONSIDER.md),
    # and HDF5 (reading .geo.h5, VTKHDF plots) is not needed by them.
    - name: Configure
      run: >
        ccache --zero-stats &&
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE=$(which python3)
        -DHYPERHDG_LEGACY_TESTS=OFF -DHYPERHDG_HDF5=OFF
    - name: Build
      run: cmake --build build -j $(nproc)
    - name: Test
      run: ctest --test-dir build --output-on-failure -j $(nproc)
    # Saved even if the tests fail, so that the next push does not compile everything again.
    - name: Save ccache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ matrix.comp.cxx }}-${{ github.sha }}
    - name: ccache statistics
      if: always()
      run: ccache --show-stats --verbose
    # Which compiler calls missed the cache, and why ccache could not use its direct mode for some.
    - name: ccache misses
      if: always()
      run: |
        awk '/Source file:/ {src[$2] = $NF} /Result:/ {print $NF, src[$2]}' ccache.log \
          | sort | uniq -c | sort -rn | grep -v '_hit ' | head -60
        grep -hoE 'Disabling direct mode.*|[Tt]oo new.*' ccache.log | sort | uniq -c | head -20
    - name: Upload ccache log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ccache-log-${{ matrix.comp.cxx }}
        path: ccache.log
        retention-days: 7
