# Author: Andreas Rupp, Heidelberg University, 2021.

name: CMake

on: [push]

env:
  PYTHON: python3-dev python3-numpy python3-scipy python3-matplotlib python3-pandas python3-joblib cython3


jobs:
  # ============== Test code on the latest Ubuntu with the latest available compilers =============
  build_and_test_ubuntu:
    strategy:
      matrix:
        osys: [ ubuntu-24.04 ]
        comp: [ {cxx: g++-14}, {cxx: clang++-19} ]

    name: Test code with ${{ matrix.comp.cxx }} on ${{ matrix.osys }}
    runs-on: ${{ matrix.osys }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
       submodules: recursive
    - name: Install Python and CXX compiler
      run: |
        sudo apt-get update;
        sudo apt-get install -y libblas-dev liblapack-dev;
        sudo apt-get install -y ${{ env.PYTHON }} ${{ matrix.comp.cxx }};
    - name: Conduct cmake test
      uses: HyperHDG/actions@cmake
      with:
        cxx_compiler: ${{ matrix.comp.cxx }}

  # ============== Test the optional OpenMP parallelization (HYPERHDG_OPENMP) with GCC =============
  build_and_test_openmp:
    name: Test code with g++-14 and OpenMP on ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
       submodules: recursive
    - name: Install Python and CXX compiler
      run: |
        sudo apt-get update;
        sudo apt-get install -y cmake libblas-dev liblapack-dev;
        sudo apt-get install -y ${{ env.PYTHON }} g++-14;
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14 -DHYPERHDG_OPENMP=ON
    - name: Build
      run: cmake --build build -j 4
    - name: Test
      run: OMP_NUM_THREADS=4 ctest --test-dir build --output-on-failure
