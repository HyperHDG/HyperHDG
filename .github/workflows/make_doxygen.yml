# Author: Andreas Rupp, Heidelberg University, 2021.

name: Doxygen

# Deployed from main. On pull requests that touch documented files it is built as a check only.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'include/**'
      - 'examples/**'
      - 'doxygen/**'
      - '**.md'
      - 'submodules/tensor_product_polynomials.git'
      - 'submodules/tensor_product_chain_complex.git'
      - '.github/workflows/make_doxygen.yml'
  workflow_dispatch:

# A new push to a pull request supersedes the run of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make_and_deploy_doxygen:
    name: Make and deploy doxygen
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout current branch
      uses: actions/checkout@v4
    # Only TPP and TPCC, which get pages of their own; no build, no CMake (doxygen/Doxyfile).
    - name: Fetch TPP and TPCC
      run: >
        git submodule update --init --depth 1 --
        submodules/tensor_product_polynomials.git submodules/tensor_product_chain_complex.git
    - name: Run build and deploy action
      uses: HyperHDG/actions@doxygen
      with:
        deploy_doxygen: ${{ github.ref == 'refs/heads/main' }}
        doxygen_command: |
          export DOXYGEN_OUTPUT_DIRECTORY=build/doxygen
          mkdir -p build/doxygen/html
          doxygen doxygen/Doxyfile.tpp
          doxygen doxygen/Doxyfile.tpcc
          doxygen doxygen/Doxyfile
        ci_repo_token: ${{ secrets.CI_REPO_TOKEN }}
        ci_user_name: HyperHDG-CI
        ci_user_mail: HyperHDG@rupp.ink
        pages_repo_organization: HyperHDG
        pages_repo_name: auto_pages
        doxygen_path: build/doxygen/html
